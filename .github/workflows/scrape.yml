# Descarga diaria de los precios de Mercadona y Consum y commit de /data si hay cambios.
# Se ejecuta sola a las 7:00 de España y también a mano:
# pestaña Actions → «Precios diarios» → botón «Run workflow».
name: Precios diarios

on:
  schedule:
    # Con timezone, GitHub aplica solo el horario de verano y de invierno (desde marzo de 2026).
    - cron: '0 7 * * *'
      timezone: 'Europe/Madrid'
    # Reserva: GitHub no garantiza que se ejecuten todos los cron (a veces se retrasan o se
    # pierden, sobre todo a las horas en punto). Si a las 9:30 aún no hay datos de hoy, se
    # descargan entonces; si ya los hay, esta ejecución no hace nada.
    - cron: '30 9 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

# Necesita escribir para poder hacer commit de /data.
permissions:
  contents: write

# Nunca dos descargas a la vez.
concurrency:
  group: precios-diarios
  cancel-in-progress: false

jobs:
  precios:
    name: Descargar precios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      # Una pasada al día como máximo: las ejecuciones programadas no hacen nada si ya hay
      # datos de hoy. Lanzado a mano, siempre descarga.
      - name: Comprobar si ya hay datos de hoy
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          hoy=$(TZ=Europe/Madrid date +%F)
          generado=$(jq -r '.generado // empty' data/meta.json 2>/dev/null || true)
          ultimo="ninguno"
          if [ -n "$generado" ]; then ultimo=$(TZ=Europe/Madrid date -d "$generado" +%F); fi
          if [ "$EVENTO" = "schedule" ] && [ "$ultimo" = "$hoy" ]; then toca=no; else toca=si; fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"
          echo "Evento: $EVENTO · hoy en España: $hoy · última descarga: $ultimo · ¿descargar?: $toca"
          if [ "$toca" = no ]; then
            echo "Ya hay precios de hoy ($hoy): esta ejecución programada no descarga nada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Instalar Node 26
        if: steps.decidir.outputs.toca == 'si'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Instalar dependencias
        if: steps.decidir.outputs.toca == 'si'
        working-directory: scraper
        run: npm ci

      - name: Descargar los precios
        if: steps.decidir.outputs.toca == 'si'
        working-directory: scraper
        run: npm run scrape

      - name: Guardar los cambios en el repositorio
        if: steps.decidir.outputs.toca == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualiza los precios del $(TZ=Europe/Madrid date +%d/%m/%Y)"
            git pull --rebase
            git push
          fi

      # Si alguna tienda ha fallado, este paso termina en rojo y GitHub avisa por correo.
      - name: Comprobar el estado de cada tienda
        if: steps.decidir.outputs.toca == 'si'
        working-directory: scraper
        shell: bash
        run: node src/comprobar-meta.ts | tee -a "$GITHUB_STEP_SUMMARY"
