# Descarga diaria de los precios de Mercadona y Consum y commit de /data si hay cambios.
# Se ejecuta sola a las 7:00 de España y también a mano:
# pestaña Actions → «Precios diarios» → botón «Run workflow».
name: Precios diarios

on:
  schedule:
    # GitHub solo entiende la hora UTC, que no cambia en verano. Se programa a las dos horas
    # posibles y el primer paso decide cuál corresponde hoy a las 7:00 de España.
    - cron: '0 5 * * *' # 7:00 en horario de verano (UTC+2)
    - cron: '0 6 * * *' # 7:00 en horario de invierno (UTC+1)
  workflow_dispatch:

# Necesita escribir para poder hacer commit de /data.
permissions:
  contents: write

# Nunca dos descargas a la vez.
concurrency:
  group: precios-diarios
  cancel-in-progress: false

jobs:
  precios:
    name: Descargar precios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Comprobar que son las 7:00 en España
        id: hora
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "$EVENTO" != "schedule" ]; then
            toca=si
          elif [ "$CRON" = "0 5 * * *" ] && [ "$desfase" = "+0200" ]; then
            toca=si
          elif [ "$CRON" = "0 6 * * *" ] && [ "$desfase" = "+0100" ]; then
            toca=si
          else
            toca=no
          fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"
          echo "Evento: $EVENTO · cron: ${CRON:-ninguno} · hora de Madrid: UTC$desfase · ¿toca hoy?: $toca"
          if [ "$toca" = no ]; then
            echo "Esta es la otra hora programada: hoy no corresponde a las 7:00 de España." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Descargar el código del repositorio
        if: steps.hora.outputs.toca == 'si'
        uses: actions/checkout@v7

      - name: Instalar Node 26
        if: steps.hora.outputs.toca == 'si'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Instalar dependencias
        if: steps.hora.outputs.toca == 'si'
        working-directory: scraper
        run: npm ci

      - name: Descargar los precios
        if: steps.hora.outputs.toca == 'si'
        working-directory: scraper
        run: npm run scrape

      - name: Guardar los cambios en el repositorio
        if: steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos."
          else
            git commit -m "Actualiza los precios del $(TZ=Europe/Madrid date +%d/%m/%Y)"
            git pull --rebase
            git push
          fi

      # Si alguna tienda ha fallado, este paso termina en rojo y GitHub avisa por correo.
      - name: Comprobar el estado de cada tienda
        if: steps.hora.outputs.toca == 'si'
        working-directory: scraper
        shell: bash
        run: node src/comprobar-meta.ts | tee -a "$GITHUB_STEP_SUMMARY"
