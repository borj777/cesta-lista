# Comprueba el código cada vez que se sube un cambio: tipos, estilo y tests.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tipos, estilo y tests del scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos, estilo y tests
        run: npm run check
